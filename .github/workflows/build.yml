name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          
      - name: Build SimpleApp APK
        run: |
          cd AndroidAPKProjects/SimpleApp
          chmod +x build_apk.sh
          ./build_apk.sh
          
      - name: Upload SimpleApp APK
        uses: actions/upload-artifact@v4
        with:
          name: simpleapp-debug-apk
          path: AndroidAPKProjects/SimpleApp/app/build/outputs/app-debug-signed.apk
