name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
        with:
          working-directory: AndroidAPKProjects/MyApp
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          working-directory: AndroidAPKProjects/MyApp
          gradle-version: wrapper
          
      - name: Build SimpleApp APK
        run: |
          cd AndroidAPKProjects/SimpleApp
          chmod +x build_apk.sh
          ./build_apk.sh
          
      - name: Build MyApp APK (Gradle)
        run: |
          cd AndroidAPKProjects/MyApp
          ./gradlew assembleDebug
          
      - name: Upload SimpleApp APK
        uses: actions/upload-artifact@v4
        with:
          name: simpleapp-debug-apk
          path: AndroidAPKProjects/SimpleApp/app/build/outputs/app-debug-signed.apk
          
      - name: Upload MyApp APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-debug-apk
          path: AndroidAPKProjects/MyApp/app/build/outputs/apk/debug/app-debug.apk