name: Build Android APK
on: [push, workflow_dispatch]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          
      - name: Build SimpleApp APK
        run: |
          cd AndroidAPKProjects/SimpleApp
          if [ -x ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            chmod +x build_apk.sh
            ./build_apk.sh
          fi
          
      - name: Build MyApp APK (Gradle)
        run: |
          cd AndroidAPKProjects/MyApp
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload SimpleApp APK
        uses: actions/upload-artifact@v4
        with:
          name: simpleapp-debug-apk
          path: AndroidAPKProjects/SimpleApp/app/build/outputs/**/*.apk
          
      - name: Upload MyApp APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-debug-apk
          path: AndroidAPKProjects/MyApp/app/build/outputs/apk/debug/app-debug.apk
