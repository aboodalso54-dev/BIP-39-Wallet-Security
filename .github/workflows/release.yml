name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release note (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/keystore"
          if printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -di > "$RUNNER_TEMP/keystore/release.keystore" 2>/dev/null &&
             keytool -list -keystore "$RUNNER_TEMP/keystore/release.keystore" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            {
              echo "MYAPP_UPLOAD_STORE_FILE=$RUNNER_TEMP/keystore/release.keystore"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Keystore restored — release APK will be signed"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing or invalid; building release APK with debug signing. Add a valid base64 keystore secret to get a signed release."
          fi

      - name: Build release APKs
        run: |
          set -e
          cd AndroidAPKProjects/MyApp
          chmod +x ./gradlew
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.4
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-release-apk
          path: AndroidAPKProjects/MyApp/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AndroidAPKProjects/MyApp/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}