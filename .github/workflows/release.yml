name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      id-token: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Make gradlew executable
      run: chmod +x android/gradlew
      
    - name: Generate keystore
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        
    - name: Set up gradle.properties
      run: |
        cat >> android/gradle.properties << EOF
        MYAPP_UPLOAD_STORE_FILE=release.keystore
        MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
        MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
        MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
        EOF
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
     
    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        files: android/app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        release_name: ${{ github.event_name == 'workflow_dispatch' && format('Release {0}', github.event.inputs.version) || format('Release {0}', github.ref_name) }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}