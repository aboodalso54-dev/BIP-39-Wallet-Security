name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release note (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Set release version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ] && [[ "$TAG" =~ ^[0-9]+\.[0-9]+ ]]; then
            echo "RELEASE_VERSION_NAME=$TAG" >> "$GITHUB_ENV"
            echo "RELEASE_VERSION_CODE=$(echo "$TAG" | awk -F. '{print $1*10000 + $2*100 + $3}')" >> "$GITHUB_ENV"
          fi

      - name: Provide signing keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/keystore/release.keystore"
          mkdir -p "$(dirname "$KS")"
          PASS="${KEYSTORE_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-my-key-alias}"
          KPASS="${KEY_PASSWORD:-android}"
          KEY_TAG="signing-key"

          use_key() {
            echo "MYAPP_UPLOAD_STORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KPASS" >> "$GITHUB_ENV"
          }

          valid() {
            [ -s "$1" ] && keytool -list -keystore "$1" -storepass "$PASS" > /dev/null 2>&1
          }

          # 1) Repository secret takes precedence
          if [ -n "$KEYSTORE_BASE64" ]; then
            if printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -di > "$KS" 2>/dev/null && valid "$KS"; then
              echo "Using keystore from repository secret"
              use_key
              exit 0
            fi
            echo "::warning::KEYSTORE_BASE64 secret is invalid; ignoring it"
          fi

          # 2) Keystore kept as a draft-release asset (stable across runs)
          ASSET_ID=$(gh api "repos/$REPO/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$KEY_TAG\") | .assets[] | select(.name == \"keystore.b64\") | .id][0] // empty" 2>/dev/null || true)
          if [ -n "$ASSET_ID" ]; then
            gh api "repos/$REPO/releases/assets/$ASSET_ID" -H "Accept: application/octet-stream" > "$RUNNER_TEMP/keystore/keystore.b64" 2>/dev/null || true
            tr -d '\n\r ' < "$RUNNER_TEMP/keystore/keystore.b64" | base64 -di > "$KS" 2>/dev/null || true
            if valid "$KS"; then
              echo "Using keystore stored in draft release '$KEY_TAG'"
              use_key
              exit 0
            fi
          fi

          # 3) First run: create the key once and persist it
          rm -f "$KS"
          keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$KPASS" \
            -dname "CN=MyApp, OU=Release, O=MyApp, L=City, ST=State, C=US" > /dev/null 2>&1
          base64 -w 0 "$KS" > "$RUNNER_TEMP/keystore/keystore.b64"
          if gh release view "$KEY_TAG" > /dev/null 2>&1; then
            gh release upload "$KEY_TAG" "$RUNNER_TEMP/keystore/keystore.b64#keystore.b64" --clobber
          else
            gh release create "$KEY_TAG" "$RUNNER_TEMP/keystore/keystore.b64#keystore.b64" \
              --draft --title "Signing key (do not publish)" \
              --notes "Internal keystore used to sign release APKs. Keep this release as draft."
          fi
          echo "Generated and stored a new signing keystore (draft release '$KEY_TAG')"
          echo "SHA-256: $(keytool -list -v -keystore "$KS" -storepass "$PASS" | grep SHA256 | head -1)"
          use_key

      - name: Build release APK and AAB
        run: |
          set -e
          cd AndroidAPKProjects/MyApp
          chmod +x ./gradlew
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.4
          fi
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          set +e
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -name apksigner -type f 2>/dev/null | sort | tail -1)
          APK=$(ls AndroidAPKProjects/MyApp/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ] || [ -z "$APK" ]; then
            echo "::warning::apksigner or APK not found; skipping signature verification"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee signing-info.txt
          if grep -q "CN=Android Debug" signing-info.txt; then
            echo "::warning::APK is debug-signed. Repository secret KEYSTORE_BASE64 is missing or invalid."
          else
            echo "Release APK is signed with the release key."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-release-apk
          path: AndroidAPKProjects/MyApp/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: myapp-release-aab
          path: AndroidAPKProjects/MyApp/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            AndroidAPKProjects/MyApp/app/build/outputs/apk/release/*.apk
            AndroidAPKProjects/MyApp/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}