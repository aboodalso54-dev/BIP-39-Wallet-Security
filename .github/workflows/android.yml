name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Build APKs (Gradle)
        run: |
          set -e
          FAILED=""
          for app in AndroidAPKProjects/MyApp AndroidAPKProjects/SimpleApp MyApp; do
            [ -f "$app/settings.gradle" ] || continue
            echo "::group::$app"
            (
              cd "$app"
              chmod +x ./gradlew || true
              if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
                echo "Wrapper jar missing — regenerating wrapper"
                gradle wrapper --gradle-version 8.4
              fi
              ./gradlew --no-daemon assembleDebug
            ) || FAILED="$FAILED $app"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Failed to build:$FAILED"
            exit 1
          fi

      - name: Run unit tests (MyApp)
        run: |
          cd AndroidAPKProjects/MyApp
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest
        continue-on-error: false

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            AndroidAPKProjects/MyApp/app/build/outputs/apk/debug/*.apk
            AndroidAPKProjects/SimpleApp/app/build/outputs/apk/debug/*.apk
            MyApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
