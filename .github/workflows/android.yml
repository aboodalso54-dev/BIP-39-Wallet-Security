name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Build APKs (Gradle)
        run: |
          set -e
          for app in AndroidAPKProjects/MyApp AndroidAPKProjects/SimpleApp; do
            echo "::group::$app"
            cd "$app"
            chmod +x ./gradlew || true
            if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Wrapper jar missing — regenerating wrapper"
              gradle wrapper --gradle-version 8.4
            fi
            ./gradlew --no-daemon assembleDebug
            cd - > /dev/null
            echo "::endgroup::"
          done

      - name: Upload MyApp debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-debug-apk
          path: AndroidAPKProjects/MyApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload SimpleApp debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simpleapp-debug-apk
          path: AndroidAPKProjects/SimpleApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14